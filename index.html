<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager - CI/CD Report</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
    h1 { color: #1f4e79; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Task Manager - CI/CD Report</h1>
  <p>This page is updated automatically by GitHub Actions on every push to main.</p>

  <h2>ToDo Tasks</h2>
  <pre id="pending">
</pre>

  <h2>Done Tasks</h2>
  <pre id="completed">
</pre>

  <h2>Unit Test Results</h2>
  <pre id="unittest">
</pre>
</body>
</html>
