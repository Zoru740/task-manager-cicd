name: GitHub Projects Automation

on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  move-issue-to-done:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # Step 1: checks out the repository to the runner's environment
        uses: actions/checkout@v4

      - name: Check if PR is merged and mark linked issues Done
        # Step 2: only runs if the pull request was merged (not just closed)
        if: github.event.pull_request.merged == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Step 3: find issues linked with "Closes #N" in the PR description
          ISSUES=$(echo "$PR_BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' | sort -u)
          if [ -z "$ISSUES" ]; then
            echo "No linked issues found in PR #$PR_NUMBER"
            exit 0
          fi
          gh label create done --color 0E8A16 --description "Completed via merged PR" --force
          for N in $ISSUES; do
            echo "Marking issue #$N as Done"
            gh issue edit "$N" --add-label done
            gh issue comment "$N" --body "Moved to Done automatically: PR #$PR_NUMBER was merged."
          done
