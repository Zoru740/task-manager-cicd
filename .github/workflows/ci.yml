name: CI Workflow - Docker

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # Step 1: checks out the repository code to the runner's environment
        uses: actions/checkout@v4

      - name: Build Docker image
        # Step 2: builds a Docker image named 'task-manager' from the Dockerfile
        run: docker build -t task-manager:latest .

      - name: Run Docker container
        # Step 3: runs the container, passing the GitHub username as GITHUB_USER.
        # --rm removes the container after execution.
        run: docker run --rm -e GITHUB_USER="${{ github.actor }}" task-manager:latest
